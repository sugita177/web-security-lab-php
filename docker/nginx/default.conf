# 【Phase 3-2】IPアドレス単位のレートリミットゾーン定義（10MB共有メモリ、1秒あたり2リクエスト）
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=2r/s;

server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    # アクセスログとエラーログの標準出力
    access_log /dev/stdout;
    error_log /dev/stderr;

    # Nginxバージョンの非表示（セキュリティの基本情報隠蔽）
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPMへのプロキシ設定
    location ~ \.php$ {
        # 【Phase 3-2】レートリミット適用（burst=5, nodelay, 超過時はHTTP 429を返却）
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;

        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # クライアント情報の伝播（後のProxy Header学習用）
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_HOST $http_host;
    }
}

# 【Phase 4-2】HTTPS サーバー設定 (ポート 443 / 公開ポート 8443)
server {
    listen 443 ssl;
    server_name localhost;
    root /var/www/html;
    index index.php index.html;

    # SSL証明書と秘密鍵
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    # SSLプロトコルと暗号スイートの推奨設定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /dev/stdout;
    error_log /dev/stderr;
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # HTTPS通信フラグの伝播 (PHP側で $_SERVER['HTTPS'] == 'on' を判定可能にする)
        fastcgi_param HTTPS on;
        fastcgi_param REMOTE_ADDR $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_HOST $http_host;
    }
}
