services:
  nginx:
    image: nginx:alpine
    container_name: security-lab-nginx
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src:/var/www/html:ro
    depends_on:
      - php
    networks:
      - lab-network

  php:
    image: php:8.5-fpm-alpine
    container_name: security-lab-php
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini:ro
    networks:
      - lab-network

  # 【Phase 2-2 オンデマンド追加】攻撃者専用Webサーバー (別オリジン: ポート 8081)
  attacker-site:
    image: nginx:alpine
    container_name: security-lab-attacker
    ports:
      - "8081:80"
    volumes:
      - ./docker/attacker:/usr/share/nginx/html:ro
    networks:
      - lab-network

networks:

  lab-network:
    driver: bridge
