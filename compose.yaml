services:
  nginx:
    image: nginx:alpine
    container_name: security-lab-nginx
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src:/var/www/html:ro
    depends_on:
      - php
    networks:
      - lab-network

  php:
    image: php:8.5-fpm-alpine
    container_name: security-lab-php
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini:ro
    networks:
      - lab-network

networks:
  lab-network:
    driver: bridge
