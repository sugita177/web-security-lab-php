services:
  nginx:
    image: nginx:alpine
    container_name: security-lab-nginx
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
      - ./src:/var/www/html:ro
    depends_on:
      - php
    networks:
      - lab-network

  php:
    build:
      context: ./docker/php
    container_name: security-lab-php
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini:ro
    depends_on:
      - mysql
      - redis
    networks:
      - lab-network

  # 【Phase 5-2 オンデマンド追加】分散セッション用 Redis コンテナ
  redis:
    image: redis:7-alpine
    container_name: security-lab-redis
    ports:
      - "6379:6379"
    networks:
      - lab-network

  # 【Phase 2-3 オンデマンド追加】MySQLデータベースコンテナ
  mysql:
    image: mysql:8.0
    container_name: security-lab-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: security_lab
      MYSQL_USER: lab_user
      MYSQL_PASSWORD: lab_password
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - lab-network


  # 【Phase 2-2 オンデマンド追加】攻撃者専用Webサーバー (別オリジン: ポート 8081)
  attacker-site:
    image: nginx:alpine
    container_name: security-lab-attacker
    ports:
      - "8081:80"
    volumes:
      - ./docker/attacker:/usr/share/nginx/html:ro
    networks:
      - lab-network

networks:

  lab-network:
    driver: bridge
